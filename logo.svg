<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Градиент для круга (планеты) -->
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4A90E2" />
      <stop offset="100%" stop-color="#001F54" />
    </linearGradient>
    
    <!-- Градиент для орбиты -->
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Эффект свечения -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(32, 32)">
    <!-- Основной круг -->
    <circle cx="0" cy="0" r="18" stroke="url(#circleGrad)" stroke-width="3.5" fill="none" filter="url(#glow)" />
    
    <!-- Кольцо орбиты -->
    <ellipse cx="0" cy="0" rx="28" ry="10" transform="rotate(-30)" stroke="url(#orbitGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)" />
  </g>
</svg>
